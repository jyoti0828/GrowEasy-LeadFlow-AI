version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Inside Docker, frontend container reaches backend via service name, not localhost
      - NEXT_PUBLIC_API_BASE_URL=http://backend:5000/api
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
